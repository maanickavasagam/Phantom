[project]
name = "phantom-ai"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI File()/Depends() defaults are idiomatic

[tool.ruff.lint.per-file-ignores]
# Call scripts are spoken sentences; keeping each turn on one line keeps them readable.
"phantom/echo/make_calls.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
